<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Chart - GoJS Genogram</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f5f5f5;
    }

    .header {
      background: #2c3e50;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 500;
    }

    .header-controls {
      display: flex;
      gap: 0.5rem;
    }

    .header-controls button {
      background: #3498db;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.2s;
    }

    .header-controls button:hover {
      background: #2980b9;
    }

    .container {
      display: flex;
      height: calc(100vh - 60px);
    }

    #myDiagramDiv {
      flex: 1;
      background: white;
      border: 1px solid #ddd;
    }

    .sidebar {
      width: 300px;
      background: white;
      border-left: 1px solid #ddd;
      padding: 1rem;
      overflow-y: auto;
    }

    .sidebar h3 {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: #2c3e50;
    }

    .legend {
      margin-bottom: 1.5rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
    }

    .legend-shape {
      width: 24px;
      height: 24px;
      border: 2px solid #333;
    }

    .legend-shape.male {
      background: white;
    }

    .legend-shape.female {
      background: white;
      border-radius: 50%;
    }

    .legend-shape.unknown {
      background: white;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }

    .legend-shape.deceased {
      background: linear-gradient(to bottom right, white 45%, transparent 45%, transparent 55%, white 55%);
      position: relative;
    }

    .legend-shape.deceased::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, transparent 45%, #333 45%, #333 55%, transparent 55%);
    }

    #myInspectorDiv {
      position: absolute;
      display: none;
      background: white;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0.75rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 1000;
      max-width: 250px;
      font-size: 0.875rem;
    }

    #myInspectorDiv table {
      width: 100%;
      border-collapse: collapse;
    }

    #myInspectorDiv td {
      padding: 0.25rem 0;
    }

    #myInspectorDiv td:first-child {
      font-weight: 600;
      color: #666;
      padding-right: 0.5rem;
    }

    .stats {
      background: #ecf0f1;
      padding: 0.75rem;
      border-radius: 4px;
      font-size: 0.875rem;
    }

    .stats-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.25rem;
    }

    .stats-item:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Family Chart - GoJS Genogram</h1>
    <div class="header-controls">
      <button id="myScrollToProband">Go to Proband</button>
      <button id="myPrintButton">Print</button>
      <button id="myDownloadButton">Download SVG</button>
    </div>
  </div>

  <div class="container">
    <div id="myDiagramDiv"></div>

    <div class="sidebar">
      <h3>Legend</h3>
      <div class="legend">
        <div class="legend-item">
          <div class="legend-shape male"></div>
          <span>Male</span>
        </div>
        <div class="legend-item">
          <div class="legend-shape female"></div>
          <span>Female</span>
        </div>
        <div class="legend-item">
          <div class="legend-shape unknown"></div>
          <span>Unknown Sex</span>
        </div>
      </div>

      <h3>Statistics</h3>
      <div class="stats" id="statsDiv">
        <div class="stats-item">
          <span>Total Members:</span>
          <span id="totalMembers">-</span>
        </div>
        <div class="stats-item">
          <span>Generations:</span>
          <span id="generations">-</span>
        </div>
        <div class="stats-item">
          <span>Proband:</span>
          <span id="probandName">-</span>
        </div>
      </div>
    </div>
  </div>

  <div id="myInspectorDiv"></div>

  <script type="module" src="/src/index.js"></script>
</body>
</html>
